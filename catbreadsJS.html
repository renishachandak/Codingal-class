<html>
    <head>
        <title>Cat Breads</title>
    </head>
    <body>
        <h1>Facts about Different Cat Breads</h1>
        <button onclick="showcats()">Show Cat Breads!!!</button>
        <div class="cards">
            <div id="card1"></div>
            <div id="card2"></div>
            <div id="card3"></div>
        </div>
        <script>
            class Cat {
                constructor(name,fact) {
                    this.name = name;
                    this.fact = fact;
                }
                describe() {
                    return this.name + ": " + this.fact;
                }
            }

            function showcats(){
                let p1 = new Cat("Persian Cat", "one of the oldest and most popular cat breeds")
                let p2 = new Cat("Siberian Cat", "known for their triple-layer coats, love for water, and slow growth")
                let p3 = new Cat("Bengal Cat", "They weigh between 8 to 15 pounds and have a typical lifespan of 9 to 15 years")
            
                
        document.getElementById("card1").innerHTML =p1.name + " description " + p1.describe()
        document.getElementById("card2").innerHTML =p2.name + " description " + p2.describe()
        document.getElementById("card3").innerHTML =p3.name + " description " + p3.describe()
        
            } 
        
        </script>
    </body>
</html>
