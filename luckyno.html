<html>
    <head>
        <title>Lucky Guess!!!</title>
    </head>
    <body>

        <h1>Guess The Lucky Number!!!</h1>

        <input id="name" placeholder="Your Name" required><br>
        <p id="name-msg"></p>

        <input id="guess" placeholder="Guess a number (1 to 10)" min="1" max="10" required><br>
        <p id="guess-msg"></p>

        <button onclick="checkForm()">Try My Luck!</button>
        <p id="result"></p>
        <p id="timer"></p>
    
        <script>

            var seconds = 0;
            setInterval(function() {
                seconds = seconds + 1;
                document.getElementById("timer").innerHTML = "You Have Been Here For " + seconds + " Seconds!!";
            },1000)

            function checkForm() {
                var name = document.getElementById("name").value;
                var guess = document.getElementById("guess").value;
                var ok = true;

                if (name == "") {
                    document.getElementById("name-msg").innerHTML = "Plese Enter Your Name";
                    document.getElementById("name-msg").style.color = "red";
                    ok = false;
                } 

                else { 
                    document.getElementById("name-msg").innerHTML = "Great Name!!";
                    document.getElementById("name-msg").style.color = "green";              
                }

                if (ok == true) {
                    var lucky = Math.floor(Math.random() * 10) + 1;
                    if (guess == lucky) {
                        document.getElementById("result").innerHTML = "You Win " + name + "!! The Lucky Number Was " +  lucky + "!";
                        document.getElementById("result").style.color = "green"
                    } else {
                        document.getElementById("result").innerHTML = "So Close," + name + " The lucky numer was " + lucky + ". Try again!";
                        document.getElementById("result").style.color = "blue"
                    }
                }
            }
        </script>
    </body>
</html>
